{% extends 'base.html' %}

{% block title %}Delete Project{% endblock %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">

        <h2 class="mb-3">Delete Project</h2>

        <p>
            Are you sure you want to delete
            <strong>{{ project.name }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Yes, Delete
            </button>

            <a href="{% url 'project-detail' project.pk %}"
               class="btn btn-secondary">
                Cancel
            </a>
        </form>

    </div>
</div>

{% endblock %}
