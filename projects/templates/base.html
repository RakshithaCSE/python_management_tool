<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Project Management Tool
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body>

    <!-- Navigation Bar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <!-- Website Name -->

            <a
                class="navbar-brand"
                href="/">

                Project Management Tool

            </a>


            <!-- Mobile Menu Button -->

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavigation">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Navigation Links -->

            <div
                class="collapse navbar-collapse"
                id="mainNavigation">

                <div class="navbar-nav ms-auto">

                    <!-- Projects -->

                    <a
                        class="nav-link"
                        href="/">

                        Projects

                    </a>


                    <!-- Tasks -->

                    <a
                        class="nav-link"
                        href="/tasks/">

                        Tasks

                    </a>


                    <!-- Kanban -->

                    <a
                        class="nav-link"
                        href="/kanban/">

                        Kanban

                    </a>


                    <!-- Reports -->

                    <a
                        class="nav-link"
                        href="/reports/">

                        Reports

                    </a>


                    <!-- Analytics -->

                    <a
                        class="nav-link"
                        href="/analytics/">

                        Analytics

                    </a>


                    <!-- Time Tracking -->

                    <a
                        class="nav-link"
                        href="/time-tracking/">

                        Time Tracking

                    </a>

                </div>

            </div>

        </div>

    </nav>


    <!-- Main Content -->

    <main class="container mt-4">

        {% block content %}

        {% endblock %}

    </main>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
