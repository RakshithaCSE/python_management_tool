{% extends 'base.html' %}

{% block title %}Create Project{% endblock %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">

        <h2 class="mb-4">Create Project</h2>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Save Project
            </button>

            <a href="{% url 'project-list' %}" class="btn btn-secondary">
                Cancel
            </a>
        </form>

    </div>
</div>

{% endblock %}
